name: Publish artifact and create update PR on eCommerce projects

on:
  release:
    types: [ published ]

permissions:
  pull-requests: write
  packages: write

jobs:
  deploy_artifact:
    name: Deploy github package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/publish-maven-artifacts
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  create_pr:
    strategy:
      matrix:
        config:
          - repo: pagopa-ecommerce-transactions-service
            build_tool: maven
          - repo: pagopa-ecommerce-transactions-scheduler-service
            build_tool: maven
          - repo: pagopa-ecommerce-event-dispatcher-service
            build_tool: maven
          - repo: pagopa-ecommerce-payment-methods-service
            build_tool: maven
          - repo: pagopa-ecommerce-helpdesk-service
            build_tool: gradle
          - repo: pagopa-ecommerce-helpdesk-commands-service
            build_tool: gradle
          - repo: pagopa-ecommerce-cdc-service
            build_tool: gradle

    name: Create PR on ${{ matrix.config.repo }}
    runs-on: ubuntu-latest
    needs: deploy_artifact
    steps:
      - name: Get latest release tag from pagopa-ecommerce-commons
        id: get_latest_tag
        run: |
          git clone https://github.com/pagopa/pagopa-ecommerce-commons
          cd pagopa-ecommerce-commons
          latestTag=$(git describe --tags --abbrev=0)
          echo "Latest ecommerce-commons tag: $latestTag"
          echo "LATEST_TAG=$latestTag" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout pagopa/${{ matrix.config.repo }}
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: pagopa/${{ matrix.config.repo }}

      - name: Replace old version with new version (Maven)
        if: matrix.config.build_tool == 'maven'
        uses: jacobtomlinson/gha-find-replace@a51bbcd94d000df9ca0fcb54ec8be69aad8374b0
        with:
          find: "<pagopa-ecommerce-commons.version>\\d+\\.\\d+\\.\\d+</pagopa-ecommerce-commons.version>"
          replace: "<pagopa-ecommerce-commons.version>${{ steps.get_latest_tag.outputs.LATEST_TAG }}</pagopa-ecommerce-commons.version>"
          regex: true
          include: "pom.xml"

      - name: Update dep lock & verification files (Maven)
        if: matrix.config.build_tool == 'maven'
        id: update_lock_dependencies_maven
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          latest_tag="${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          max_attempts=6

          for attempt in $(seq 1 "$max_attempts"); do
             ./mvnw depcheck:generate

            if jq -e --arg version "$latest_tag" '
              any(
                .dependencies[];
                .groupId == "it.pagopa" and
                .artifactId == "pagopa-ecommerce-commons" and
                .version == $version
              )
            ' dep-sha256.json >/dev/null; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Dependency metadata in dep-sha256.json was not updated to ${latest_tag}" >&2
              exit 1
            fi

            echo "Artifacts for ${latest_tag} are not fully available yet; retrying in 15 seconds (${attempt}/${max_attempts})..."
            sleep 15
          done
        shell: bash

      - name: Replace old version with new version (Gradle)
        if: matrix.config.build_tool == 'gradle'
        uses: jacobtomlinson/gha-find-replace@a51bbcd94d000df9ca0fcb54ec8be69aad8374b0
        with:
          find: "val ecommerceCommonsVersion = \"\\d+\\.\\d+\\.\\d+\""
          replace: "val ecommerceCommonsVersion = \"${{ steps.get_latest_tag.outputs.LATEST_TAG }}\""
          regex: true
          include: "build.gradle.kts"

      - name: Update dep lock & verification files (Gradle)
        if: matrix.config.build_tool == 'gradle'
        id: update_lock_dependencies
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          latest_tag="${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          max_attempts=6

          for attempt in $(seq 1 "$max_attempts"); do
            ./gradlew dependencies --refresh-dependencies --write-locks --write-verification-metadata sha256

            if grep -q "it.pagopa:pagopa-ecommerce-commons:${latest_tag}=" gradle.lockfile &&
              grep -q "<component group=\"it.pagopa\" name=\"pagopa-ecommerce-commons\" version=\"${latest_tag}\">" gradle/verification-metadata.xml; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Dependency lock and verification metadata were not updated to ${latest_tag}" >&2
              exit 1
            fi

            echo "Artifacts for ${latest_tag} are not fully available yet; retrying in 15 seconds (${attempt}/${max_attempts})..."
            sleep 15
          done
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ec5c347639a548ade7d8ad1d6740e38
        with:
          branch: "update-commons-${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          token: ${{ secrets.PR_GITHUB_TOKEN }}
          author: pagopa-platform-github-bot <pagopa-github-bot@pagopa.it>
          committer: pagopa-platform-github-bot <pagopa-platform-github-bot@pagopa.it>
          commit-message: "chore(deps): update `commons` version to ${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          title: "chore(deps): update `commons` version to ${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          body: |
            <!--- Please always add a PR description as if nobody knows anything about the context these changes come from. -->
            <!--- Even if we are all from our internal team, we may not be on the same page. -->
            <!--- Write this PR as you were contributing to a public OSS project, where nobody knows you and you have to earn their trust. -->
            <!--- This will improve our projects in the long run! Thanks. -->
            
            #### List of Changes
            
            <!--- Describe your changes in detail -->
            * update `pagopa-ecommerce-commons` version to ${{ steps.get_latest_tag.outputs.LATEST_TAG }}
            
            #### Motivation and Context
            <!--- Why is this change required? What problem does it solve? -->
            Ordinary maintenance
            
            #### How Has This Been Tested?
            <!--- Please describe in detail how you tested your changes. -->
            <!--- Include details of your testing environment, tests ran to see how -->
            <!--- your change affects other areas of the code, etc. -->
            
            #### Types of changes
            
            <!--- What types of changes does your code introduce? Put an `x` in all the boxes that apply: -->
            
            - [ ] Bug fix (non-breaking change which fixes an issue)
            - [ ] New feature (non-breaking change which adds functionality)
            - [ ] Breaking change (fix or feature that would cause existing functionality to not work as expected)
            
            #### Checklist:
            
            <!--- Go over all the following points, and put an `x` in all the boxes that apply. -->
            <!--- If you're unsure about any of these, don't hesitate to ask. We're here to help! -->
            
            - [ ] My change requires a change to the documentation.
            - [ ] I have updated the documentation accordingly.
          labels: |
            🤖 automatic
            commons
            patch
            chart-patch
